<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register</title>
  <style>
    body {
      background: #e0e5ec;
      font-family: 'Roboto', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .neumorph-form {
      background: #e0e5ec;
      border-radius: 32px;
      box-shadow: 12px 12px 32px #bfc4d1, -12px -12px 32px #fff;
      padding: 2.7rem 2.5rem 3.2rem 2.5rem;
      max-width: 420px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      align-items: stretch;
      margin-top: 2rem;
    }
    .neumorph-form h2 {
      font-family: 'Montserrat', Arial, sans-serif;
      color: #8B5CF6;
      font-size: 2rem;
      text-align: center;
      margin-bottom: 1.2rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-shadow: 0 2px 8px #fff;
    }
    .neumorph-form input[type="text"],
    .neumorph-form input[type="password"],
    .neumorph-form input[type="email"] {
      width: 90%;
      background: #e0e5ec;
      border: none;
      border-radius: 16px;
      padding: 1.1rem 1.4rem;
      font-size: 1.13rem;
      color: #4B5563;
      font-family: 'Roboto', Arial, sans-serif;
      outline: none;
      box-shadow: inset 6px 6px 16px #cfd2dc, inset -6px -6px 16px #fff;
      transition: box-shadow 0.2s, background 0.2s;
      margin-top: 0.2rem;
      font-weight: 500;
    }
    .neumorph-form input:focus {
      box-shadow: 0 0 0 2px #FACC15, inset 6px 6px 16px #cfd2dc, inset -6px -6px 16px #fff;
      background: #f7f8fa;
    }
    .neumorph-form button[type="submit"] {
      background: #FACC15;
      color: #fff;
      border: none;
      border-radius: 18px;
      font-family: 'Montserrat', Arial, sans-serif;
      font-size: 1.18rem;
      padding: 1rem 2rem;
      cursor: pointer;
      box-shadow: 6px 6px 16px #cfd2dc, -6px -6px 16px #fff;
      margin-top: 1.2rem;
      transition: background 0.2s, color 0.2s, box-shadow 0.2s, transform 0.2s;
      letter-spacing: 1px;
      font-weight: 700;
      outline: none;
    }
    .neumorph-form button[type="submit"]:hover {
      background: #8B5CF6;
      color: #fff;
      box-shadow: 0 0 0 4px #FACC15, 12px 12px 32px #bfc4d1, -12px -12px 32px #fff;
      transform: translateY(-2px) scale(1.06);
    }
    .neumorph-link {
      display: block;
      text-align: center;
      margin-top: 1.2rem;
      color: #8B5CF6;
      font-family: 'Montserrat', Arial, sans-serif;
      font-weight: 600;
      text-decoration: none;
      transition: color 0.2s;
    }
    .neumorph-link:hover {
      color: #FACC15;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <form method="POST" class="neumorph-form">
    <h2>Register</h2>
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Register</button>
    <a href="{% url 'login' %}" class="neumorph-link">Already have an account? Login</a>
  </form>
</body>
</html>
